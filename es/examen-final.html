<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Ableton 101 — Examen Final: Certificación</title>
  <style>
    :root {
      --bg:#111; --surface:#1c1c1e; --text:#fff; --muted:#888;
      --border:#333; --audio:#0055FF; --play:#00B84D; --danger:#E53E3E;
      --accent:#FFBC00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; padding: 2rem 5%; line-height: 1.6; }
    
    .btn-back { position:absolute; top:20px; left:20px; background:var(--surface); color:var(--text); text-decoration:none; padding:10px 15px; border-radius:8px; border:2px solid var(--border); font-weight:bold; }
    
    .container { max-width: 900px; margin: 4rem auto; }
    header { text-align: center; margin-bottom: 3rem; }
    h1 { font-size: 3.5rem; margin-bottom: 1rem; color: var(--accent); }
    p.sub { font-size: 1.2rem; color: var(--muted); }
    
    .q-container { background: var(--surface); border: 2px solid var(--border); border-radius: 16px; padding: 3rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; }
    .q-container.active { display: block; animation: fadeIn 0.4s ease; }
    
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    
    .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 2rem; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
    
    h2.q-text { font-size: 1.8rem; margin-bottom: 2rem; }
    
    .opt-btn { display: block; width: 100%; text-align: left; background: #2c2c2e; color: #fff; border: 2px solid transparent; padding: 1.2rem 1.5rem; border-radius: 12px; margin-bottom: 1rem; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
    .opt-btn:hover { background: #3a3a3c; border-color: #555; }
    .opt-btn.correct { background: var(--play) !important; color: #fff; border-color: #fff; transform: scale(1.02); }
    .opt-btn.wrong { background: var(--danger) !important; color: #fff; }
    .opt-btn:disabled { cursor: not-allowed; }
    
    .next-btn { background: var(--audio); color: #fff; border: none; padding: 1.2rem 2.5rem; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; display: none; margin-top: 2rem; width: 100%; transition: 0.2s; }
    .next-btn:hover { filter: brightness(1.2); }
    
    .results { text-align: center; }
    .score-circle { width: 200px; height: 200px; border-radius: 50%; border: 15px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 4rem; font-weight: bold; margin: 0 auto 2rem; }
  </style>
</head>
<body>

<a href="../index.html" class="btn-back">← Salir</a>

<div class="container">
  <header>
    <h1>Examen Final de Certificación</h1>
    <p class="sub">60 Preguntas. Demuestra todo lo que aprendiste desde la Clase 1 a la 15.</p>
  </header>
  
  <div class="progress-bar">
    <div class="progress-fill" id="pbar"></div>
  </div>
  <div style="text-align:right; margin-top:-1.5rem; margin-bottom:2rem; color:var(--muted); font-weight:bold;" id="q-counter">Pregunta 1 de 60</div>
  
  <div id="quiz-mount"></div>
  
</div>

<script>
  const questions = [{"q":"¿Qué significa DAW?","opts":["Digital Audio Workspace","Digital Audio Workstation","Direct Audio Work","Digital Analog Workstation"],"ans":1},{"q":"¿Cuál es la frecuencia de muestreo estándar para un CD de audio?","opts":["48 kHz","96 kHz","44.1 kHz","88.2 kHz"],"ans":2},{"q":"La profundidad de bits (Bit Depth) determina principalmente:","opts":["El volumen máximo y el rango dinámico","La frecuencia máxima","El estéreo","El uso de CPU"],"ans":0},{"q":"¿Qué tecla usas en Ableton para cambiar entre la vista Session y Arrangement?","opts":["Espacio","Tab","Shift + Tab","Enter"],"ans":1},{"q":"¿Para qué sirve la vista Session en Ableton Live?","opts":["Para editar audio destructivamente","Para disparar clips y experimentar ideas sin una línea de tiempo fija","Para masterizar la canción","Para renderizar el video"],"ans":1},{"q":"¿Qué es un Clip en Ableton?","opts":["Un plugin","Un contenedor de audio o MIDI","Un efecto de reverberación","Una pista entera"],"ans":1},{"q":"¿Cuál es el atajo para deshacer una acción (Undo)?","opts":["Cmd/Ctrl + Z","Cmd/Ctrl + X","Cmd/Ctrl + C","Cmd/Ctrl + D"],"ans":0},{"q":"El botón 'OVR' (Overdub) en Ableton sirve para:","opts":["Sobrescribir el audio","Grabar notas MIDI adicionales sobre un clip existente sin borrar las anteriores","Subir el volumen","Cuantizar las notas"],"ans":1},{"q":"¿Qué significa 'Cuantizar'?","opts":["Bajar el volumen","Alinear automáticamente las notas a una cuadrícula rítmica (grid)","Cambiar el tono","Exportar la pista"],"ans":1},{"q":"¿Cómo duplicas un clip o sección seleccionada rápidamente?","opts":["Cmd/Ctrl + C","Cmd/Ctrl + D","Cmd/Ctrl + V","Cmd/Ctrl + J"],"ans":1},{"q":"¿Qué es el MIDI?","opts":["Audio digital comprimido","Un protocolo de datos que transmite información de notas y control, pero no sonido","Un formato de micrófono","Un sintetizador analógico"],"ans":1},{"q":"El efecto MIDI 'Arpeggiator' hace lo siguiente:","opts":["Afina la voz","Toma un acorde y toca sus notas una por una secuencialmente","Hace que el sonido suene en reversa","Comprime el audio"],"ans":1},{"q":"¿Qué hace el efecto MIDI 'Scale'?","opts":["Sube el volumen","Fuerza todas las notas entrantes para que encajen en una escala musical específica","Repite el sonido","Añade reverberación"],"ans":1},{"q":"La diferencia entre un efecto de Inserción (Insert) y Envío (Send) es:","opts":["El inserto se aplica a toda la canción, el envío solo a un clip","El inserto procesa el 100% de la señal en el canal, el envío procesa una copia paralela en un canal de retorno","No hay diferencia","El envío es solo para MIDI"],"ans":1},{"q":"¿Para qué se usa un Filtro High Pass (HPF)?","opts":["Para dejar pasar los agudos y cortar los graves","Para dejar pasar los graves y cortar los agudos","Para subir el volumen general","Para añadir distorsión"],"ans":0},{"q":"¿Qué controla el parámetro 'Feedback' en un Delay?","opts":["El volumen inicial","La cantidad de repeticiones (ecos) antes de que el sonido se apague","El paneo","La frecuencia de corte"],"ans":1},{"q":"¿Cuál es el propósito principal de una Reverberación (Reverb)?","opts":["Hacer que el sonido suene más fuerte","Simular el espacio acústico o entorno físico donde ocurre el sonido","Cortar graves","Afinar notas"],"ans":1},{"q":"El 'Piano Roll' es...","opts":["Una vista para dibujar y editar notas MIDI en una cuadrícula","Un plugin de ecualización","Un atajo de teclado","Un tipo de micrófono"],"ans":0},{"q":"¿Qué hace el parámetro 'Dry/Wet' en un efecto de audio?","opts":["Balancea la señal original (Dry) con la señal procesada (Wet)","Sube los graves (Dry) y los agudos (Wet)","Mutea la pista","Enciende y apaga el sintetizador"],"ans":0},{"q":"El atajo para crear una nueva pista MIDI es:","opts":["Cmd/Ctrl + T","Cmd/Ctrl + Shift + T","Cmd/Ctrl + M","Cmd/Ctrl + R"],"ans":1},{"q":"En la estructura típica de EDM, ¿qué sucede en el 'Drop'?","opts":["Es el clímax de la canción donde entra toda la energía (bombo y bajo)","La canción se acaba","Se quitan todos los instrumentos","Se hace una pausa de silencio"],"ans":0},{"q":"¿Qué es un 'Build-up'?","opts":["El inicio de la canción","Una sección que genera tensión antes del clímax","Un efecto de audio","El outro"],"ans":1},{"q":"La 'Regla del 4 y 8' se refiere a que:","opts":["Solo puedes usar 4 u 8 pistas","Los cambios en la música electrónica suelen ocurrir cada 4, 8, 16 o 32 compases","El tempo siempre es 48","Los acordes solo pueden tener 4 notas"],"ans":1},{"q":"Un 'Riser' (Sweep Up) de ruido blanco se utiliza principalmente para:","opts":["Hacer el bajo más gordo","Generar anticipación y tensión conectando dos secciones","Reemplazar al bombo","Evitar el clipping"],"ans":1},{"q":"¿Cuál es el atajo para Consolidar (unir) varios clips en uno solo?","opts":["Cmd/Ctrl + C","Cmd/Ctrl + D","Cmd/Ctrl + J","Cmd/Ctrl + L"],"ans":2},{"q":"¿Qué es el 'Signal Flow' (Flujo de Señal)?","opts":["El volumen del master","El camino que recorre el audio desde la fuente (ej. micrófono) hasta la salida (disco duro o monitores)","Un plugin de Ableton","La velocidad de bits"],"ans":1},{"q":"¿Para qué sirve hacer un 'Crossfade' entre dos clips de audio superpuestos?","opts":["Para subirles el tono","Para evitar clics y pops bruscos realizando una transición suave entre ambos","Para comprimir la señal","Para volverlos MIDI"],"ans":1},{"q":"¿Qué es el 'Comping' al grabar audio?","opts":["Comprimir el audio","Grabar múltiples tomas en bucle para luego elegir y unir las mejores partes de cada toma","Afilar la forma de onda","Exportar a MP3"],"ans":1},{"q":"Las 'Clip Envelopes' (Envolventes de Clip) en Ableton permiten:","opts":["Dibujar automatizaciones de volumen, panorama o tono directamente dentro del clip de audio","Crear una nueva pista","Borrar el archivo de la computadora","Mandar MIDI a otro sintetizador"],"ans":0},{"q":"Si grabas una guitarra eléctrica directamente a la interfaz sin un amplificador, necesitas activar la opción:","opts":["48V Phantom Power","Hi-Z (Instrumento)","Pad -20dB","MIDI IN"],"ans":1},{"q":"En la analogía de la mezcla como una Caja 3D, el Paneo (Pan) representa:","opts":["El alto (Frecuencias)","La profundidad (Volumen)","El ancho (Izquierda a Derecha)","El tamaño del archivo"],"ans":2},{"q":"El 'Headroom' se define como:","opts":["El espacio de seguridad que dejas entre tus picos de volumen y el 0 dBFS para evitar distorsión","El espacio físico en tu cuarto","El tamaño de la memoria RAM","El volumen mínimo"],"ans":0},{"q":"Por regla general en la música electrónica y pop moderna, ¿qué instrumentos se panean estrictamente al CENTRO (Mono)?","opts":["Guitarras y Coros","Hi-hats y Platillos","Bombo (Kick), Bajo y Voz Principal","Sintetizadores PAD"],"ans":2},{"q":"¿Qué es el 'Gain Staging'?","opts":["Ajustar los niveles en cada etapa del camino de la señal para mantener una ganancia óptima sin saturar","Poner un limitador en el master","Comprar equipo caro","Subir el fader al máximo"],"ans":0},{"q":"Agrupar pistas (Cmd/Ctrl + G) sirve principalmente para:","opts":["Borrar pistas juntas","Controlar y procesar múltiples pistas relacionadas (ej. todas las baterías) con un solo fader y plugins comunes","Separar el estéreo","Aumentar el tempo"],"ans":1},{"q":"¿Cuál es el problema conocido como 'Enmascaramiento' (Masking)?","opts":["Cuando dos pistas no se graban bien","Cuando dos sonidos compiten por el mismo rango de frecuencias (ej. bombo y bajo), haciéndose borrosos","Cuando la voz suena muy bajita","Cuando se pierde el archivo de audio"],"ans":1},{"q":"¿Qué es un EQ Paramétrico?","opts":["Un EQ que solo tiene dos botones (Graves y Agudos)","Un EQ que permite ajustar la frecuencia exacta, la ganancia y el ancho de banda (Q) de cada filtro","Un EQ automático","Un ecualizador de guitarra"],"ans":1},{"q":"El parámetro 'Threshold' (Umbral) en un compresor:","opts":["Determina qué tan rápido actúa el compresor","Define el nivel de volumen exacto a partir del cual el compresor empieza a aplastar la señal","Añade reverberación","Determina cuándo se apaga la compresión"],"ans":1},{"q":"¿Qué significa un 'Ratio' de 4:1 en un compresor?","opts":["Que el compresor multiplica el audio por 4","Que por cada 4 dB que la señal intente pasar el umbral, el compresor solo dejará pasar 1 dB","Que tarda 4 milisegundos en actuar","Que hay 4 compresores en serie"],"ans":1},{"q":"El efecto 'Sidechain Compression' (Ducking) es vital para:","opts":["Hacer que un bajo o sintetizador reduzca su volumen rítmicamente cada vez que golpea el bombo (Kick)","Afinar guitarras","Darle brillo a la mezcla","Subir el volumen del master"],"ans":0},{"q":"¿Cuál de estas formas de onda básica tiene armónicos impares y un sonido 'hueco' (ideal para bajos o tipo clarinete)?","opts":["Senoidal","Diente de Sierra","Cuadrada","Triangular"],"ans":2},{"q":"En un sintetizador, ¿qué significa VCO?","opts":["Virtual Control Oscillator","Voltage Controlled Oscillator","Vocal Control Option","Volume Control Output"],"ans":1},{"q":"El filtro Low Pass (LPF) hace lo siguiente:","opts":["Deja pasar las frecuencias bajas y corta las altas","Deja pasar las altas y corta las bajas","Sube el volumen","Corta los medios"],"ans":0},{"q":"En una envolvente ADSR, ¿qué representa el 'Attack' (Ataque)?","opts":["El tiempo que tarda el sonido en caer a cero al soltar la tecla","El volumen de sostenimiento","El tiempo que tarda el sonido en alcanzar su volumen máximo desde que se presiona la tecla","La afinación del sintetizador"],"ans":2},{"q":"En ADSR, ¿cuál es el único parámetro que no se mide en Tiempo, sino en Nivel de Volumen?","opts":["Attack","Decay","Sustain","Release"],"ans":2},{"q":"¿Qué es un LFO (Low Frequency Oscillator)?","opts":["Un oscilador muy agudo","Un oscilador inaudible que se usa para modular o mover automáticamente otros parámetros (ej. hacer vibrato)","Un efecto de distorsión","Un filtro especial"],"ans":1},{"q":"La síntesis FM (Frecuencia Modulada) funciona:","opts":["Usando la frecuencia de un oscilador (Modulador) para alterar la frecuencia de otro oscilador (Portador) a gran velocidad","Mezclando dos señales de audio con un ecualizador","Pasando ruido blanco por un filtro","Muestreando audio real"],"ans":0},{"q":"¿Qué es la Síntesis Wavetable (Tabla de Ondas)?","opts":["Grabar una guitarra en vivo","Hacer FM con 6 operadores","Un método que permite 'navegar' por una tabla tridimensional de ciclos de onda para crear sonidos evolutivos","Un tipo de compresor"],"ans":2},{"q":"El parámetro 'Resonance' (Resonancia) en un filtro:","opts":["Baja el volumen","Crea un pico de volumen justo en la frecuencia de corte (Cutoff), acentuando ese punto","Añade graves","Aumenta la reverberación"],"ans":1},{"q":"¿Qué operador en FM es el que finalmente se escucha en la salida?","opts":["El Modulador","El Carrier (Portador)","El LFO","La Envolvente"],"ans":1},{"q":"¿Para qué sirve el 'Drum Rack' en Ableton?","opts":["Para afinar baterías acústicas","Es un instrumento contenedor donde cada pad dispara un sample distinto al recibir una nota MIDI específica","Para ecualizar voces","Para grabar guitarras"],"ans":1},{"q":"¿Qué significa 'Swing' en la programación de ritmos?","opts":["Tocar muy fuerte","Tocar muy rápido","Retrasar deliberadamente las notas pares (ej. los 16vos) para darle un sentido humano o 'groove' al patrón","Afilar la envolvente"],"ans":2},{"q":"Un 'Polirritmo' ocurre cuando:","opts":["Dos patrones rítmicos de diferente métrica (ej. 4/4 y 3/4) suenan al mismo tiempo","Todos los instrumentos tocan la misma nota","Se graba una batería real","El tempo cambia a mitad de la canción"],"ans":0},{"q":"El efecto MIDI 'Velocity' se utiliza para:","opts":["Cambiar el volumen del master","Alterar la fuerza o intensidad con la que se tocan las notas MIDI, dándole dinámica humana","Cambiar el tono de las notas","Silenciar la pista"],"ans":1},{"q":"¿Qué es el Sampling?","opts":["Cantar en un micrófono","Tomar una porción de audio grabada (sample) y reutilizarla como instrumento musical","Mezclar una canción","Exportar a WAV"],"ans":1},{"q":"La principal diferencia entre Simpler y Sampler en Ableton es:","opts":["Simpler es gratuito, Sampler no","Simpler maneja un solo archivo de audio a la vez, Sampler puede mapear múltiples muestras (multisampling) a lo largo del teclado","Sampler es para MIDI, Simpler para Audio","No hay diferencia"],"ans":1},{"q":"El proceso de 'Chopping' consiste en:","opts":["Cortar un sample largo (ej. un break de batería o una melodía) en pedazos más pequeños para re-secuenciarlos","Borrar el audio","Bajar el tempo de la canción","Añadir reverb al sample"],"ans":0},{"q":"El algoritmo de Warping 'Beats' en Ableton es ideal para:","opts":["Voces","Acordes de piano","Material rítmico y percusivo (mantiene los transitorios intactos)","Orquestas"],"ans":2},{"q":"El algoritmo de Warping 'Complex' o 'Complex Pro' es ideal para:","opts":["Material rítmico estricto","Audio que contiene múltiples notas y texturas mezcladas (canciones completas, acordes, voces)","Bajos","Sintetizadores puros"],"ans":1},{"q":"El 'Groove Pool' en Ableton permite:","opts":["Bañarse en la piscina","Extraer la 'sensación rítmica' (swing/timing) de un clip de audio o MIDI y aplicársela a otro","Exportar todas las pistas","Afinar la batería"],"ans":1},{"q":"La diferencia principal entre Mezcla y Masterización es:","opts":["La mezcla une y balancea pistas individuales; el mastering prepara y pule la mezcla final estéreo para distribución comercial","La mezcla es para audio, el mastering es para MIDI","La mezcla es hacer la canción, el mastering es grabarla","No hay diferencia"],"ans":0},{"q":"¿Qué significa LUFS?","opts":["Level Upon Frequency Scale","Loudness Units relative to Full Scale (Mide el volumen percibido a lo largo del tiempo)","Low Ultra Frequency System","Limitador Universal de Fase"],"ans":1},{"q":"¿Cuál es el LUFS objetivo aproximado que recomiendan plataformas como Spotify (-14) para evitar que bajen tu canción?","opts":["-6 LUFS","-14 LUFS","0 LUFS","-30 LUFS"],"ans":1},{"q":"Un 'Limitador' (Brickwall Limiter) es básicamente:","opts":["Un ecualizador inverso","Un compresor con un ratio infinito (ej. 100:1) que no deja pasar absolutamente ningún pico por encima de su Ceiling","Un generador de reverb","Un oscilador subgrave"],"ans":1},{"q":"¿Qué significa 'True Peak'?","opts":["El pico de la montaña","El valor máximo analógico interpolado que alcanzará la señal digital, ayudando a evitar distorsión inter-sample","El volumen de los graves","El ratio del compresor"],"ans":1},{"q":"El procesamiento 'Mid/Side' permite:","opts":["Grabar el medio y los lados del cuarto","Ecualizar o comprimir la información mono (centro) independientemente de la información estéreo (lados)","Escuchar la canción de lado","Duplicar la pista"],"ans":1},{"q":"Si vas a exportar audio para Masterización externa, ¿a qué nivel de picos (Headroom) debes dejar aproximadamente el master?","opts":["+3 dB","0 dB","Entre -6 dB y -3 dB (para darle espacio al ingeniero de mastering)","-20 dB"],"ans":2},{"q":"¿Qué es el 'Dithering'?","opts":["Un error de software","Ruido de bajo nivel añadido intencionalmente al exportar a una profundidad de bits menor (ej. de 24-bit a 16-bit) para evitar distorsión de cuantización","Un efecto de guitarra","El proceso de subir volumen"],"ans":1},{"q":"El formato estándar, sin compresión, y de mayor calidad para exportar tu Master final es:","opts":["MP3 a 128kbps","WAV o AIFF a 44.1kHz / 16 o 24 bits","OGG Vorbis","AAC"],"ans":1},{"q":"¿Para qué sirve la función 'Collect All and Save' (Recopilar todo y guardar) en Ableton?","opts":["Para exportar la canción final","Para juntar todos los archivos de audio (samples, grabaciones) usados en el proyecto y guardarlos dentro de la carpeta del proyecto, asegurando que no falte nada si lo abres en otra PC","Para borrar archivos inútiles","Para hacer un backup en la nube automáticamente"],"ans":1}];
  
  let current = 0;
  let score = 0;
  
  function renderQ() {
    if (current >= questions.length) return showResults();
    
    document.getElementById('pbar').style.width = ((current / questions.length) * 100) + '%';
    document.getElementById('q-counter').textContent = 'Pregunta ' + (current+1) + ' de ' + questions.length;
    
    const q = questions[current];
    let html = '<div class="q-container active"><h2 class="q-text">' + q.q + '</h2>';
    
    q.opts.forEach((opt, idx) => {
      html += '<button class="opt-btn" onclick="checkAnswer(' + idx + ', ' + q.ans + ', this)">' + opt + '</button>';
    });
    
    html += '<button class="next-btn" id="nxt" onclick="nextQ()">Siguiente ➔</button></div>';
    document.getElementById('quiz-mount').innerHTML = html;
  }
  
  window.checkAnswer = function(selected, correct, btn) {
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => { b.disabled = true; b.style.opacity = '0.6'; });
    btn.style.opacity = '1';
    
    if (selected === correct) {
      btn.classList.add('correct');
      score++;
    } else {
      btn.classList.add('wrong');
      btns[correct].classList.add('correct');
      btns[correct].style.opacity = '1';
    }
    
    document.getElementById('nxt').style.display = 'block';
  }
  
  window.nextQ = function() {
    current++;
    renderQ();
  }
  
  function showResults() {
    document.getElementById('pbar').style.width = '100%';
    const pct = Math.round((score / questions.length) * 100);
    
    let color = 'var(--danger)';
    let msg = 'Necesitas volver a estudiar. Repasa los módulos.';
    if(pct >= 60) { color = 'var(--accent)'; msg = '¡Bien hecho! Aprobaste satisfactoriamente.'; }
    if(pct >= 90) { color = 'var(--play)'; msg = '¡Extraordinario! Eres un Productor Maestro certificado.'; }
    
    if (pct >= 60) localStorage.setItem('ableton101_final', pct);
    
    let html = '<div class="q-container active results">';
    html += '<h2>Resultados Finales</h2><br>';
    html += '<div class="score-circle" style="border-color:' + color + '; color:' + color + '">' + pct + '%</div>';
    html += '<h3>Acertaste ' + score + ' de ' + questions.length + ' preguntas</h3>';
    html += '<p style="color:var(--muted); margin-top:1rem; font-size:1.2rem;">' + msg + '</p>';
    html += '<br><br><a href="../index.html" class="next-btn" style="display:inline-block; text-decoration:none;">Volver al Inicio</a>';
    html += '</div>';
    
    document.getElementById('quiz-mount').innerHTML = html;
  }
  
  renderQ();
</script>
</body>
</html>
